<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolajon Tetris</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#7dd3fc,#c4b5fd);
  display:flex;
  justify-content:center;
  color:#17234d;
}
.app{
  width:min(100%,470px);
  padding:12px;
  text-align:center;
}
h1{margin:4px;font-size:30px}
.info{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:10px 0;
}
.card{
  background:white;
  padding:8px 15px;
  border-radius:14px;
  box-shadow:0 4px 12px #0002;
}
.game{
  display:inline-block;
  padding:7px;
  background:#15304b;
  border-radius:16px;
}
canvas{
  display:block;
  background:#091827;
  border-radius:10px;
  max-width:82vw;
  height:auto;
}
.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  max-width:380px;
  margin:12px auto;
}
button{
  border:0;
  border-radius:14px;
  padding:13px 8px;
  font-size:22px;
  background:white;
  box-shadow:0 4px 12px #0002;
  cursor:pointer;
}
button:active{transform:scale(.94)}
#restart{
  width:100%;
  max-width:380px;
  font-size:17px;
}
</style>
</head>

<body>
<div class="app">

<h1>🧩 Bolajon Tetris 🎮</h1>

<div class="info">
  <div class="card">⭐ Ball<br><b id="score">0</b></div>
  <div class="card">🏆 Rekord<br><b id="best">0</b></div>
  <div class="card">⚡ Daraja<br><b id="level">1</b></div>
</div>

<div class="game">
  <canvas id="game" width="240" height="480"></canvas>
</div>

<div class="controls">
  <button onclick="move(-1)">⬅️</button>
  <button onclick="rotate()">🔄</button>
  <button onclick="move(1)">➡️</button>
  <button onclick="drop()">⬇️</button>
</div>

<button id="restart" onclick="restart()">🔁 Qayta boshlash</button>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const COLS=10, ROWS=20, SIZE=24;

const colors=[
 null,
 "#00e5ff",
 "#ffd600",
 "#9c27ff",
 "#00e676",
 "#ff1744",
 "#2979ff",
 "#ff9100"
];

const shapes=[
 [[1,1,1,1]],
 [[2,2],[2,2]],
 [[0,3,0],[3,3,3]],
 [[0,4,4],[4,4,0]],
 [[5,5,0],[0,5,5]],
 [[6,0,0],[6,6,6]],
 [[0,0,7],[7,7,7]]
];

let board, piece, score, level, timer;
let best=Number(localStorage.getItem("tetrisBest")||0);

document.getElementById("best").textContent=best;

function newBoard(){
 return Array.from({length:ROWS},()=>Array(COLS).fill(0));
}

function newPiece(){
 const id=Math.floor(Math.random()*shapes.length);
 return {
   shape:shapes[id].map(r=>[...r]),
   x:Math.floor(COLS/2)-2,
   y:0
 };
}

function collide(p=piece){
 for(let y=0;y<p.shape.length;y++){
  for(let x=0;x<p.shape[y].length;x++){
   if(p.shape[y][x]){
    const bx=p.x+x, by=p.y+y;
    if(bx<0||bx>=COLS||by>=ROWS) return true;
    if(by>=0 && board[by][bx]) return true;
   }
  }
 }
 return false;
}

function merge(){
 piece.shape.forEach((row,y)=>{
  row.forEach((v,x)=>{
   if(v && piece.y+y>=0)
    board[piece.y+y][piece.x+x]=v;
  });
 });
}

function clearLines(){
 let lines=0;

 for(let y=ROWS-1;y>=0;y--){
  if(board[y].every(v=>v)){
   board.splice(y,1);
   board.unshift(Array(COLS).fill(0));
   lines++;
   y++;
  }
 }

 if(lines){
  score += [0,100,300,500,800][lines];
  level=Math.floor(score/700)+1;

  if(score>best){
   best=score;
   localStorage.setItem("tetrisBest",best);
  }

  updateInfo();
 }
}

function updateInfo(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("level").textContent=level;
}

function move(dir){
 piece.x+=dir;
 if(collide()) piece.x-=dir;
 draw();
}

function rotate(){
 const old=piece.shape;
 piece.shape=old[0].map((_,i)=>old.map(r=>r[i]).reverse());

 if(collide()) piece.shape=old;

 draw();
}

function drop(){
 piece.y++;

 if(collide()){
  piece.y--;
  merge();
  clearLines();
  piece=newPiece();

  if(collide()){
   alert("🎮 O‘yin tugadi! Ball: "+score);
   restart();
  }
 }

 draw();
}

function drawBlock(x,y,color){
 ctx.fillStyle=color;
 ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);

 ctx.strokeStyle="#ffffff55";
 ctx.strokeRect(x*SIZE,y*SIZE,SIZE,SIZE);
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 board.forEach((row,y)=>{
  row.forEach((v,x)=>{
   if(v) drawBlock(x,y,colors[v]);
  });
 });

 piece.shape.forEach((row,y)=>{
  row.forEach((v,x)=>{
   if(v) drawBlock(piece.x+x,piece.y+y,colors[v]);
  });
 });
}

function loop(){
 drop();

 clearTimeout(timer);
 timer=setTimeout(loop,Math.max(120,650-level*45));
}

function restart(){
 clearTimeout(timer);

 board=newBoard();
 piece=newPiece();
 score=0;
 level=1;

 updateInfo();
 draw();
 loop();
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft") move(-1);
 if(e.key==="ArrowRight") move(1);
 if(e.key==="ArrowDown") drop();
 if(e.key==="ArrowUp") rotate();
});

restart();
</script>

</body>
</html>
